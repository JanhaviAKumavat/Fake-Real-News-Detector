<!DOCTYPE html>
<html lang="en">

<head>


    <meta charset="UTF-8">


    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">


    <title>

        {% block title %}

        Fake News Detector AI - Admin

        {% endblock %}

    </title>




    <!-- Bootstrap 5 CSS -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">





    <!-- Font Awesome -->

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">





    <!-- Google Font -->

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">





    <!-- Admin Common CSS -->


    <link rel="stylesheet"

          href="{{ url_for('admin.static',
          filename='css/admin_layout.css') }}">



    <link rel="stylesheet"

          href="{{ url_for('admin.static',
          filename='css/sidebar.css') }}">



    <link rel="stylesheet"

          href="{{ url_for('admin.static',
          filename='css/topbar.css') }}">



    <link rel="stylesheet"

          href="{{ url_for('admin.static',
          filename='css/responsive.css') }}">






    <!-- Page Specific CSS -->

    {% block extra_css %}

    {% endblock %}



</head>




<body>


<div class="admin-wrapper" id="adminWrapper">





    <!-- ==========================
         Sidebar
    =========================== -->


    {% include "includes/sidebar.html" %}







    <!-- ==========================
         Main Area
    =========================== -->


    <div class="admin-main">






        <!-- Top Header -->


        {% include "includes/topbar.html" %}







        <!-- Page Content -->


        <main class="admin-content">



            {% include "includes/flash_message.html" %}





            {% block content %}



            {% endblock %}




        </main>







        <!-- Footer -->


        {% include "includes/admin_footer.html" %}





    </div>




</div>









<!-- Bootstrap JS -->


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">

</script>






<!-- Chart JS -->


<script src="https://cdn.jsdelivr.net/npm/chart.js">

</script>







<!-- Admin Sidebar JS -->


<script src="{{ url_for('admin.static',
filename='js/sidebar.js') }}">

</script>







<!-- Page Specific JS -->


{% block extra_js %}

{% endblock %}






</body>

</html>
